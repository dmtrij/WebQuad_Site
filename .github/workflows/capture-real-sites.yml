name: Capture real portfolio screenshots
on:
  push:
    paths:
      - ".github/workflows/capture-real-sites.yml"
      - "scripts/capture_real_sites.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer
        run: |
          pip install pillow numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium
      - name: Capture live desktop and mobile site pixels
        run: python scripts/capture_real_sites.py
      - name: Save original captures for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-site-screenshots
          path: portfolio/captures/*.png
          retention-days: 14
      - name: Commit verified PNG compositions
        run: |
          git config user.name "webquad-image-bot"
          git config user.email "webquad-image-bot@users.noreply.github.com"
          git add portfolio/assets/*.png
          git diff --cached --quiet || (git commit -m "Render transparent portfolio assets from live sites" && git push)
